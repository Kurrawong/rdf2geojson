[tool.poetry]
name = "rdf2geojson"
version = "0.9.0"
description = "A Python package that converts any RDF to GeoJSON"
authors = ["Ashley Sommer <ashley.sommer@dcceew.gov.au>"]
license = "BSD 3-Clause"
readme = "README.adoc"
packages = [{include = "rdf2geojson"}]

[tool.poetry.dependencies]
python = "^3.11"
rdflib = "^7.0.0"
pyshacl = "^0.26.0"
geojson = "^3.1.0"
pyoxigraph = { version = "<6,>=0.4.11", optional = true, allow-prereleases = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "^24.8.0"

[tool.poetry.extras]
oxigraph = ["pyoxigraph"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
